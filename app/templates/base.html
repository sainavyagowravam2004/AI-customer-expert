<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AI Customer Expert{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  {% if user %}
  <nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="font-bold text-indigo-600 text-lg">AI Customer Expert</span>
      <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium">{{ user.business_name }}</span>
      <div class="flex gap-4 text-sm font-medium text-slate-600">
        <a href="/settings" class="hover:text-indigo-600">Settings & Roles</a>
        <a href="/knowledge" class="hover:text-indigo-600">Knowledge Brain</a>
        <a href="/chat" class="hover:text-indigo-600">Support Chat</a>
        <a href="/inbox" class="hover:text-indigo-600">Email Inbox</a>
        <a href="/evals" class="hover:text-indigo-600">Evals & Self-Improve</a>
        <a href="/go-live" class="text-emerald-700 font-semibold hover:underline">Go Live (15m)</a>
      </div>
    </div>
    <form method="post" action="/logout">
      <button class="text-xs text-slate-500 hover:text-rose-600">Logout ({{ user.email }})</button>
    </form>
  </nav>
  {% endif %}
  <main class="max-w-6xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
