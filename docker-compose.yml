name: ai-customer-expert

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_customer_expert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_customer_expert"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build: .
    image: ai-customer-expert:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_customer_expert
      PROCRASTINATE_DSN: postgresql://postgres:postgres@db:5432/ai_customer_expert
      S3_ENDPOINT_URL: ""
      STORAGE_DIR: /app/storage
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - knowledge_assets:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: ai-customer-expert:dev
    command: ["procrastinate", "--app=app.worker.app", "worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_customer_expert
      PROCRASTINATE_DSN: postgresql://postgres:postgres@db:5432/ai_customer_expert
      S3_ENDPOINT_URL: ""
      STORAGE_DIR: /app/storage
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - knowledge_assets:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  knowledge_assets:
